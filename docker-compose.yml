services:
  db-proxy:
    image: alpine/socat:1.8.0.0
    network_mode: host
    command: ["TCP-LISTEN:8084,bind=0.0.0.0,reuseaddr,fork", "TCP:127.0.0.1:3306"]
    restart: unless-stopped

  agent-backend:
    build: ./agent-backend
    env_file:
      - .env
    environment:
      MEMORY_BACKEND: "${MEMORY_BACKEND:-sqlite}"
      MEMORY_SQLITE_PATH: "${MEMORY_SQLITE_PATH:-/app/data/memory.db}"
      DATA_QUERY_ENABLED: "${DATA_QUERY_ENABLED:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db-proxy
    volumes:
      - agent-data:/app/data
    ports:
      - "8082:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  agent-data:
