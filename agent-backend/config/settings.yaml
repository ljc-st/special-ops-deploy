app_name: agent-service
max_iterations: 5
system_prompt_file: ""
observation_truncate_chars: 4000
sse_ping_interval_seconds: 20.0
request_timeout_seconds: 120.0

llm:
  mode: mock
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ""
  model: "qwen3.7-plus"
  temperature: 0.3
  max_tokens: 2048
  timeout_seconds: 60.0

auth:
  enabled: false
  api_keys: []

memory:
  backend: sqlite
  host: "127.0.0.1"
  port: 3306
  user: ""
  password: ""
  database: "agent_memory"
  redis_url: "redis://localhost:6379/0"
  ttl_days: 7
  sqlite_path: "data/memory.db"
  window_turns: 6
  window_chars: 12000

tools:
  config_path: "config/tools.yaml"
